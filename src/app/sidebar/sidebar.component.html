<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- Collapse toggle -->
  <button class="sidebar-toggle" (click)="toggleCollapse()" [attr.title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path *ngIf="!collapsed" d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z" />
      <path *ngIf="collapsed" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z" />
    </svg>
  </button>

  <div class="sidebar-content" *ngIf="!collapsed">
    <!-- Quick Navigation -->
    <div class="sidebar-section">
      <div class="section-label">Navigation</div>

      <button class="nav-item" [class.active]="isViewActive(viewModeEnum.All)"
        (click)="selectView(viewModeEnum.All)">
        <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
          <path d="M21,16V4H3V16H21M21,2A2,2 0 0,1 23,4V16A2,2 0 0,1 21,18H14V20H16V22H8V20H10V18H3C1.89,18 1,17.1 1,16V4C1,2.89 1.89,2 3,2H21Z" />
        </svg>
        <span class="nav-label">All Channels</span>
      </button>

      <button class="nav-item" [class.active]="isViewActive(viewModeEnum.Favorites)"
        (click)="selectView(viewModeEnum.Favorites)">
        <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
          <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
        </svg>
        <span class="nav-label">Favorites</span>
      </button>

      <button class="nav-item" [class.active]="isViewActive(viewModeEnum.History)"
        (click)="selectView(viewModeEnum.History)">
        <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
          <path d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" />
        </svg>
        <span class="nav-label">History</span>
      </button>

      <button class="nav-item" [class.active]="isViewActive(viewModeEnum.Hidden)"
        (click)="selectView(viewModeEnum.Hidden)">
        <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
          <path d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z" />
        </svg>
        <span class="nav-label">Hidden</span>
      </button>
    </div>

    <!-- Categories by Source -->
    <div class="sidebar-section" *ngIf="sources.length > 0">
      <div class="section-label">Categories</div>

      <div *ngFor="let source of sources" class="source-group">
        <button class="source-header" (click)="toggleSource(source)">
          <svg viewBox="0 0 24 24" fill="currentColor" class="chevron-icon" [class.expanded]="source.expanded">
            <path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z" />
          </svg>
          <span class="source-name">{{ source.name }}</span>
          <span class="source-badge">{{ source.groups.length }}</span>
        </button>

        <div class="category-list" *ngIf="source.expanded">
          <button *ngFor="let group of source.groups"
            class="category-item" [class.active]="isCategoryActive(group.id)"
            [class.hidden-group]="group.hidden"
            (click)="selectCategory(group)">
            <span class="category-name">{{ group.name }}</span>
            <span class="category-count" *ngIf="group.channelCount">{{ group.channelCount }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Footer -->
    <div class="sidebar-footer">
      <button class="nav-item settings-item" (click)="openSettings()">
        <svg viewBox="0 0 24 24" fill="currentColor" class="nav-icon">
          <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
        </svg>
        <span class="nav-label">Settings</span>
      </button>
    </div>
  </div>
</aside>
