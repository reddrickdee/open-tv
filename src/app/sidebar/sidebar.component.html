<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-header">
    <button class="collapse-btn" (click)="toggleCollapse()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path *ngIf="!collapsed" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
        <path *ngIf="collapsed" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
      </svg>
    </button>
    <span class="sidebar-title" *ngIf="!collapsed">Fred TV</span>
  </div>

  <nav class="sidebar-nav" *ngIf="!collapsed">
    <div class="nav-section">
      <button class="nav-item" [class.active]="currentViewMode === viewModeEnum.All"
        (click)="selectViewMode(viewModeEnum.All)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21,16V4H3V16H21M21,2A2,2 0 0,1 23,4V16A2,2 0 0,1 21,18H14V20H16V22H8V20H10V18H3C1.89,18 1,17.1 1,16V4C1,2.89 1.89,2 3,2H21Z" />
        </svg>
        <span>All Channels</span>
      </button>
      <button class="nav-item" [class.active]="currentViewMode === viewModeEnum.Favorites"
        (click)="selectViewMode(viewModeEnum.Favorites)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
        </svg>
        <span>Favorites</span>
      </button>
      <button class="nav-item" [class.active]="currentViewMode === viewModeEnum.History"
        (click)="selectViewMode(viewModeEnum.History)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" />
        </svg>
        <span>History</span>
      </button>
      <button class="nav-item" [class.active]="currentViewMode === viewModeEnum.Categories"
        (click)="selectViewMode(viewModeEnum.Categories)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z" />
        </svg>
        <span>Categories</span>
      </button>
      <button class="nav-item" [class.active]="currentViewMode === viewModeEnum.Hidden"
        (click)="selectViewMode(viewModeEnum.Hidden)">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z" />
        </svg>
        <span>Hidden</span>
      </button>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-section">
      <div class="section-title">Filters</div>
      <label class="filter-item">
        <input type="checkbox" [checked]="chkLiveStream"
          (change)="toggleMediaType(mediaTypeEnum.livestream)" />
        <span>Livestreams</span>
      </label>
      <label class="filter-item">
        <input type="checkbox" [checked]="chkMovie"
          (change)="toggleMediaType(mediaTypeEnum.movie)" />
        <span>Movies/VOD</span>
      </label>
      <label class="filter-item" *ngIf="showSeriesFilter">
        <input type="checkbox" [checked]="chkSerie"
          (change)="toggleMediaType(mediaTypeEnum.serie)" />
        <span>Series</span>
      </label>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-section sources-section">
      <div class="section-title">Sources</div>
      <div *ngFor="let entry of memory.Sources | keyvalue" class="source-group">
        <button class="source-header" (click)="toggleSource(entry.key)">
          <svg viewBox="0 0 24 24" fill="currentColor" class="chevron"
            [class.expanded]="expandedSources.has(entry.key)">
            <path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z" />
          </svg>
          <span>{{ entry.value.name }}</span>
        </button>
        <div class="category-list" *ngIf="expandedSources.has(entry.key)">
          <button *ngFor="let group of sourceCategories.get(entry.key)"
            class="category-item" (click)="selectCategory(group.id!, entry.key)">
            {{ group.name }}
          </button>
          <div class="category-empty" *ngIf="!sourceCategories.get(entry.key)?.length">
            No categories
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer" *ngIf="!collapsed">
    <button class="nav-item settings-btn" (click)="openSettings()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
      </svg>
      <span>Settings</span>
    </button>
  </div>
</aside>
